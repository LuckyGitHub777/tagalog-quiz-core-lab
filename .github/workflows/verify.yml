name: Verify independent source edition
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout without token persistence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify source manifest and local assets
        run: python -m unittest discover -s tests -v
      - name: Test independent JS core
        run: node --test tests/test_core.mjs
